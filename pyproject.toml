[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "operationproof"
version = "0.0.1"
description = "Vendor-neutral trust fabric and evidence connector for governed AI operations"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Eimy Herrer" }]
dependencies = []

[project.urls]
Repository = "https://github.com/nulleimy/OperationProof"

[project.scripts]
operationproof-verify = "operationproof.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
