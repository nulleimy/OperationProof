[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "operationproof"
version = "0.0.1"
description = "Vendor-neutral trust fabric and evidence connector for governed AI operations"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Eimy Herrer" }]
dependencies = []

[project.urls]
Repository = "https://github.com/nulleimy/OperationProof"

[project.scripts]
operationproof-gateway = "operationproof.gateway_runtime:main"
operationproof-sidecar = "operationproof.sidecar_runtime:main"
operationproof-verify = "operationproof.cli:main"

[project.optional-dependencies]
attestations = [
    "cryptography>=50.0.0,<51",
]
sidecar = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.52.3,<0.53",
]
gateway = [
    "fastapi>=0.141.1,<0.142",
    "httpx==0.28.1",
    "uvicorn>=0.52.3,<0.53",
]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "cryptography>=50.0.0,<51",
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.52.3,<0.53",
    "httpx==0.28.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
